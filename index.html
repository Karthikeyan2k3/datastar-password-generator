<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="style.css">
	<title>Random password generator (Datastar + JS)</title>
	<script type="module" src="vendor/datastar-pwgen.js"></script>
</head>

<body data-signals="{ 
			_numbers: false, 
			_uppercase: false, 
			_lowercase: false, 
			_ascii: false, 
			_space: false, 
			_customcheck: false, 
			_customchar: '', 
			_type: 'length',
			_len: 10,
			_entropy: 124,
			_refresh: 0
			}" data-computed:_charset="initCharSet($_numbers, $_uppercase, $_lowercase, $_ascii, $_space, $_customcheck, $_customchar)"
		data-computed:_wholelen="calcLength($_type, $_len, $_entropy, $_charset)"
		data-computed:_entropystr="calcEntropy($_charset, $_wholelen)"
		data-effect="$_password = ($_charset && $_wholelen > 0 && $_wholelen <= 10000) ? generatePassword($_charset, $_wholelen, $_refresh) : ''">
		<h1>Random password generator (Datastar + JS)</h1>
		<fieldset data-attr:disabled="$_customcheck">
			<legend>Character-set</legend>
			<label><input type="checkbox" data-bind:_numbers />
				Numbers<i>(0123456789)</i></label><br />
			<label><input type="checkbox" data-bind:_uppercase />
				Uppercase<i>(ABCDEFGHIJKLMNOPQRSTUVWXYZ)</i></label><br />
			<label><input type="checkbox" data-bind:_lowercase />
				Lowercase<i>(abcdefghijklmnopqrstuvwxyz)</i></label><br />
			<label><input type="checkbox" data-bind:_ascii />
				Ascii<i>(!"#$%&'()*+,-./:;<=>?@[\]^_`{|}~)</i></label><br />
			<label><input type="checkbox" data-bind:_space />
				Space<i>()</i></label><br />
		</fieldset>
		<fieldset data-attr:disabled="$_numbers || $_uppercase || $_lowercase || $_ascii || $_space">
			<legend>Create-character-set</legend>
			<label>
				<input type="checkbox" data-bind:_customcheck />
				Custom: <input type="text" data-bind:_customchar data-on:input="$_customcheck=true" />
			</label><br />
		</fieldset>
		<fieldset>
			<legend>Password-strength</legend>
			<label>
				<input type="radio" name="type" value="length" data-bind:_type /> Length:
				<input type="number" data-on:input="$_type='length'" data-bind:_len /> characters
			</label><br />
			<label>
				<input type="radio" name="type" value="entropy" data-bind:_type /> Entropy:
				<input type="number" data-on:input="$_type='entropy'" data-bind:_entropy /> bits
			</label><br />
			<span data-show="$_type==='entropy' && $_charset.length==1" style="display:none;">
				Error: Need atleast 2 distinct characters in set
			</span>
			<span data-show="$_wholelen > 10000 && !($_type==='entropy' && $_charset.length==1)" style="display:none;">
				Error: Password length too large
			</span>
			<span data-show="$_wholelen < 0" style="display:none;">
				Error: Negative password length
			</span><br />
		</fieldset>
		<section>
			<strong >Password:</strong>
			<output id="password" data-text="$_password"></output><br />

			<button type="button" data-on:click="$_refresh++" data-attr:disabled="$_password === ''" title="Re-generate">&#x21bb;</button>
			<button type="button" data-copy="#password" data-attr:disabled="$_password == ''" title="Copy">Copy</button>

			<p id="strength" data-show="$_password != ''" style="display:none;">
				Length: <output data-text="$_wholelen"></output> chars,
				Charset size: <output data-text="$_charset.length"></output> symbols,
				Entropy: <output data-text="$_entropystr"></output> bits
			</p>
		</section>
	<script src="script.js"></script>
</body>

</html>
